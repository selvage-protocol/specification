name: release

# A release is the protocol itself: the schema, the vectors, the canonical-form
# definition and the prose that binds them, pinned and downloadable as one
# bundle. There is no registry and no image; the tag plus the GitHub Release
# carrying the bundle IS the release.
#
# The owner triggers a release from this workflow. `workflow_dispatch` (with a
# `version` input) is the manual button; pushing a tag `v*` runs the same job
# for a release cut by hand. Either way the job is idempotent: an existing
# tag must point at this run's commit before any asset is attached, and an
# existing release gets the bundle refreshed rather than a second release.
# A pull request runs validate.yml instead and can never publish or release.
#
# Two jobs, so that the one holding a write token runs no code it did not have to. `validate`
# installs from PyPI and runs this repository's Python — the same checks as validate.yml, every
# one of them — with a read-only token that is not left on disk. `release` runs only after it
# passes, installs nothing, and does no more than zip the tree, check where the commit is, tag
# it and attach the bundle. A release is only cut from a commit already on the default branch:
# a dispatch can name any ref and a tag can be pushed at any commit, and neither is review.
#
# The wire version string is `selvage/1` and the canonical form is `SJ-C/1`.
# Both are protocol CONSTANTS, not release versions; the release version is
# the `version` input on dispatch, or the tag name on a tag push. The typo
# guard names the near-homophone `salvage/1`, one keystroke away.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v (the tag v<version> is created)"
        required: true
        default: "0.1.1"
      dry_run:
        description: "Validate and build the bundle without tagging or releasing"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job names what it needs.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The checks import `schema/validate.py`, and an import writes a `__pycache__` beside it.
    # Nothing in this job needs a cache on disk.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      # Refused here, before anything else runs, so a bad value costs nothing. The version
      # passes through `env` rather than a workflow expression inside `run:`, so no part of it
      # is read as shell syntax, and its shape lives in `scripts/check-release-version.sh`,
      # where it has a test.
      - name: check the release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          scripts/check-release-version.sh "$version"

      # Same pins as validate.yml, so a bundle that passes here cannot fail there.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0 websockets==16.1 cryptography==50.0.0

      # The bundle must hold what CI proves: every step of validate.yml, not a subset of it.
      - name: validate the schemas and the vectors
        run: python3 schema/validate.py

      - name: check the runner's comparison code
        run: python3 runner/test_runner.py

      - name: check the binary decoder
        run: python3 runner/test_yprotocols.py

      - name: replay the peer corpus's frame layer
        run: python3 runner/run_peer.py

      - name: require every peer vector to fail under the mutation it declares
        run: python3 runner/run_peer.py --mutation-census

      - name: re-derive the peer corpus's frames from its recipes
        run: python3 runner/test_recipe.py

      - name: check the workflows and the release-version guard
        run: python3 scripts/check-workflows.py

      - name: reject the wire-version typo
        run: |
          if grep -rn "salvage/1" PROTOCOL.md CANONICAL.md NOTES.md README.md schema vectors runner; then
            printf 'found the near-homophone salvage/1; the wire version is selvage/1\n' >&2
            exit 1
          fi

      # The bundle is built here as well, read-only, so that a dry run — which never reaches
      # the job below — still shows what a release would carry. `PYTHONDONTWRITEBYTECODE`
      # keeps the checks above from leaving a `__pycache__` for it to pick up.
      - name: build the bundle
        run: |
          zip -r bundle.zip schema vectors PROTOCOL.md CANONICAL.md LICENSE
          unzip -l bundle.zip

      - name: stop before tagging on a dry run
        if: inputs.dry_run == true
        run: |
          echo "dry_run: validated and built the bundle, tagging and releasing nothing."

  release:
    needs: validate
    # A dry run ends with `validate`: nothing below it is needed, and nothing holding a write
    # token runs for it.
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `contents: write` creates and pushes the tag and the GitHub Release. Nothing else is
    # granted, and nothing in this job installs a package or runs the repository's Python.
    permissions:
      contents: write
    steps:
      # The whole history, so that the commit can be placed on the default branch below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release is a commit the default branch already carries. A dispatch from a feature
      # branch, or a tag pushed at an unmerged commit, is refused here, before any script of
      # that commit runs with this job's token, the bundle is built or anything is tagged.
      - name: require the commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            printf 'refusing: %s is not on %s; a release is cut from a reviewed commit\n' "$GITHUB_SHA" "$DEFAULT_BRANCH" >&2
            exit 1
          fi

      # The version was refused or accepted by `validate`; it is resolved again here rather
      # than handed across, and put through the same guard, because a value written into
      # `$GITHUB_ENV` must never carry a second line.
      - name: resolve the release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          scripts/check-release-version.sh "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # The bundle is what a consumer pins: the machine-readable model, the conformance
      # corpus, the two normative documents, and the licence the prose, schema and vectors
      # are released under (CC-BY-4.0). It is zipped from this job's own checkout of the
      # commit `validate` checked, and no Python has run in this tree, so no `__pycache__`
      # rides into it (one rode into `v0.1.1`'s bundle when the two were one job).
      - name: build the bundle
        run: |
          bundle="selvage-spec-v${RELEASE_VERSION}.zip"
          zip -r "$bundle" schema vectors PROTOCOL.md CANONICAL.md LICENSE
          unzip -l "$bundle"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      # Tags are resolved against `origin`, not local refs: the checkout may
      # not have fetched them. An existing tag must point at this run's
      # commit; anything else is someone else's release and stops the job.
      # An annotated tag's own ref resolves to the tag object, not the commit
      # it names, so both the plain ref and its peeled `^{}` form are queried
      # and the peeled (commit) sha is preferred when present.
      - name: create and push the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_refs=$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}" "refs/tags/v${RELEASE_VERSION}^{}" 2>/dev/null)
          if [ -n "$remote_refs" ]; then
            remote_sha=$(printf '%s\n' "$remote_refs" | tail -n1 | cut -f1)
            echo "tag v${RELEASE_VERSION} already exists at ${remote_sha}"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              printf 'refusing: tag v%s points at %s, not this run\n' "$RELEASE_VERSION" "$remote_sha" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
            git push origin "v${RELEASE_VERSION}"
          fi

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          # Selvage session protocol specification v${RELEASE_VERSION}

          The protocol itself, pinned and downloadable: the JSON Schema model
          (\`schema/\`), the conformance corpus (\`vectors/\`), and the two normative
          documents (\`PROTOCOL.md\`, \`CANONICAL.md\` defining the SJ-C/1 byte form),
          exactly as validated on the tag's commit.

          The wire version string is \`selvage/1\`. It is a protocol constant, not
          this release's version.

          Prose, schema and vectors are CC-BY-4.0 (see \`LICENSE\` in the bundle).
          EOF
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "release v${RELEASE_VERSION} already exists; refreshing the bundle asset."
            gh release upload "v${RELEASE_VERSION}" "$BUNDLE" --clobber
          else
            gh release create "v${RELEASE_VERSION}" --title "v${RELEASE_VERSION}" --notes-file release-notes.md "$BUNDLE"
          fi
