name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      # validate.py's two imports, plus the one the runner's WebSocket client needs.
      # Pinned so a check that passes here cannot start failing on the runner because a
      # dependency moved.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0 websockets==16.1

      - name: validate the schemas and the vectors
        run: python3 schema/validate.py

      # `schema/validate.py` checks the frame bytes a vector *claims*; the runner is the
      # code that checks them against a server. Only the second half needs a `selvaged`,
      # and `reference_server` is private, so the replay itself cannot run here — but the
      # comparison it is built on can, and it is tested in both directions, because a
      # comparison that cannot fail is not a check. Run `python3 runner/run_vectors.py`
      # with SELVAGE_SELVAGED set to replay the wire.
      - name: check the runner's comparison code
        run: python3 runner/test_runner.py

      - name: check the binary decoder
        run: python3 runner/test_yprotocols.py
