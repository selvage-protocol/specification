name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      # validate.py's two imports, plus the one the runner's WebSocket client needs.
      # Pinned so a check that passes here cannot start failing on the runner because a
      # dependency moved.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0 websockets==16.1

      - name: validate the schemas and the vectors
        run: python3 schema/validate.py

      # The runner has two halves. The frame half needs no server and runs here; the
      # replay half spawns a `selvaged`, and `reference_server` is private, so this job
      # cannot check it out or build one. The wire half of the suite — 87 frame
      # comparisons across the twelve transcripts — is therefore NOT covered by CI.
      # Run `python3 runner/run_vectors.py` with SELVAGE_SELVAGED set to cover it.
      - name: replay the vectors' frame half
        run: python3 runner/run_vectors.py --schema-only

      - name: check the binary decoder
        run: python3 runner/test_yprotocols.py
