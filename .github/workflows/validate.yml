name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      # The only two imports validate.py has. Pinned so a check that passes here
      # cannot start failing on the runner because a dependency moved.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0

      - name: validate the schemas and the vectors
        run: python3 schema/validate.py
