name: validate

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      # validate.py's two imports, plus the one the runner's WebSocket client needs.
      # Pinned so a check that passes here cannot start failing on the runner because a
      # dependency moved.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0 websockets==16.1

      - name: validate the schemas and the vectors
        run: python3 schema/validate.py

      # `schema/validate.py` checks the frame bytes a vector *claims*: the shape, the
      # canonical bytes, the pinned counts, and the per-vector census of asserted error
      # and close codes — the census is what makes a substitution inside a closed
      # vocabulary a red run here. The runner is the code that checks those claims against
      # a server, and only that second half needs a `selvaged`: it runs in the reference
      # server's own suite, over the vendored corpus, rather than here, because this
      # workflow has no Rust toolchain to build one with — but the comparison the replay
      # is built on can run here, and it is tested in both directions, because a
      # comparison that cannot fail is not a check. Run `python3 runner/run_vectors.py`
      # with SELVAGE_SELVAGED set to replay the wire.
      - name: check the runner's comparison code
        run: python3 runner/test_runner.py

      - name: check the binary decoder
        run: python3 runner/test_yprotocols.py

      # The two workflows, and the guard in `release.yml` that decides what a release is
      # called. Checked here as well as at release time, because a pull request is where a
      # wrong action revision would be tested and merged, while `release.yml` is reached
      # only by a dispatch or a tag push, neither of which a pull request runs. This check
      # needs neither the dependencies above nor a server.
      - name: check the workflows and the release-version guard
        run: python3 scripts/check-workflows.py
