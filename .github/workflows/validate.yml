name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      # validate.py's two imports, plus the one the runner's WebSocket client needs.
      # Pinned so a check that passes here cannot start failing on the runner because a
      # dependency moved.
      - name: install dependencies
        run: python3 -m pip install jsonschema==4.26.0 referencing==0.37.0 websockets==16.1

      - name: validate the schemas and the vectors
        run: python3 schema/validate.py

      # The runner has two halves. The frame half needs no server and runs here; the
      # replay half spawns a `selvaged`, and `reference_server` is private, so this job
      # cannot check it out or build one. The wire half of the suite — 87 frame
      # comparisons across the twelve transcripts — is therefore NOT covered by CI.
      # Run `python3 runner/run_vectors.py` with SELVAGE_SELVAGED set to cover it.
      - name: replay the vectors' frame half
        run: python3 runner/run_vectors.py --schema-only

      - name: check the binary decoder
        run: python3 runner/test_yprotocols.py

  # Actions results are not readable where the maintainer works; an issue is the only signal.
  report:
    needs: [schemas]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failing run: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Failing run: $RUN"
          fi

  clear:
    needs: [schemas]
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN"
          fi
